<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>乱记 · DSH 交互验证</title>

<style>
:root { color-scheme: dark; --dsw-alias-bg-base:#18191c;--dsw-alias-bg-overlay:#242529;--dsw-alias-label-primary:#e8eaf0;--dsw-alias-label-secondary:#aeb2bc;--dsw-alias-border-l1:#3b3e46;--dsw-alias-brand-primary:#5075d4;--dsw-alias-interactive-bg-hover:#ffffff08;--dsw-alias-bg-layer-1:#232324;--dsw-alias-bg-layer-2:#2c2c2e;--dsw-alias-border-l2:#ffffff1f;--dsw-alias-label-tertiary:#9096a1;--dsw-static-deepseek-450:#5686fe;--dsw-static-deepseek-500:#4176e6;--dsw-static-neutral-00:#fff; }
body { margin:0; background:var(--dsw-alias-bg-base); color:var(--dsw-alias-label-primary); font:14px/1.8 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; }button{font:inherit;color:inherit;cursor:pointer;background:none;border:0} #shell { display:grid;grid-template-columns:220px 1fr;height:100vh; } #entry{padding:18px 8px} #entry .panel-list{display:flex;flex-direction:column;gap:2px} #entry .panel-row{display:flex;align-items:center;gap:6px;width:100%;height:36px;padding:7px 9px;border-radius:12px;text-align:left} #entry .panel-row:hover{background:var(--dsw-alias-interactive-bg-hover)} #entry .panel-glyph{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none}aside{border-right:1px solid var(--dsw-alias-border-l1);display:flex;flex-direction:column;padding:18px 8px} .brand{padding:8px 12px;font-size:16px;font-weight:600}.fixture-label{font-size:11px;color:var(--dsw-alias-label-secondary);padding:0 12px}.nav{padding:24px 12px;flex:1}.nav button{display:block;padding:8px;border-radius:6px;text-align:left;width:100%}.nav button:hover{background:var(--dsw-alias-interactive-bg-hover)}#center{overflow:auto;height:100vh}#conversation{max-width:750px;margin:auto;padding:35px 40px}h2{font-size:16px;font-weight:500;margin:0 0 40px}.chat-node{padding:16px 0;margin-bottom:20px}.chat-node p{font-size:16px;line-height:1.9;margin:5px 0}.role{font-size:12px;color:var(--dsw-alias-label-secondary)}.user{background:var(--dsw-alias-interactive-bg-hover);border-radius:10px;padding:14px 18px;margin-left:45px}.composer-mock{border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:12px;margin-top:40px}.composer-mock textarea{width:100%;resize:none;background:none;border:0;color:inherit;font:inherit}.light {color-scheme:light;--dsw-alias-bg-base:#fff;--dsw-alias-bg-overlay:#fff;--dsw-alias-label-primary:#24262b;--dsw-alias-label-secondary:#626873;--dsw-alias-border-l1:#dce0e6;--dsw-alias-interactive-bg-hover:#10152207;--dsw-alias-brand-primary:#3f68ce;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#fff;--dsw-alias-border-l2:#0000001a;--dsw-alias-label-tertiary:#81858c;}
@media(max-width:700px){#shell{grid-template-columns:150px 1fr}#conversation{padding:25px 18px}}
</style></head><body><div id="shell"><aside><div class="brand">DeepSeek Harness</div><div class="fixture-label">隔离的交互验证环境</div><div class="nav"><button id="session-a">乱记产品讨论</button><button id="session-b">另一段对话</button><button id="theme">切换明暗</button></div><div id="entry"><nav class="panel-list" aria-label="全局面板"><button type="button" class="panel-row" aria-label="乱记"><span class="panel-glyph"></span><span>乱记</span></button></nav></div></aside><div id="center"><div id="conversation" data-conversation-session="fixture-a"></div><div id="management" hidden></div></div></div><div id="overlays"></div>
<script>window.__ModuleLoader__={load(def){window.__luanjiDef=def}}</script><script src="/dsh-luanji/__dev__/client.js"></script>
<script>
const h=React.createElement, roots={glyph:ReactDOM.createRoot(document.querySelector('#entry .panel-glyph')),management:ReactDOM.createRoot(document.getElementById('management')),overlays:ReactDOM.createRoot(document.getElementById('overlays'))};
let active='fixture-a'; const listeners=new Set(), cleanups=[];
const nodes=new Map([
 ['user-1',{kind:'user',data:{seq:1}}],
 ['assistant-1',{kind:'assistant-step',data:{turn:1,step:1}}],
 ['assistant-2',{kind:'assistant-step',data:{turn:2,step:1}}],
]);
const events=[{event:{type:'user/message',seq:1,data:{id:'u-1',content:[]}}},{event:{type:'assistant/message',data:{turn:1,step:1,message:{id:'a-1',source:{provider:'deepseek',model:'DeepSeek V3.2'}}}}},{event:{type:'assistant/message',data:{turn:2,step:1,message:{id:'a-2',source:{provider:'openai',model:'GPT-5'}}}}}];
function renderConversation(){document.getElementById('conversation').dataset.conversationSession=active;document.getElementById('conversation').innerHTML=`<h2>${active==='fixture-a'?'乱记产品讨论':'另一段对话'}</h2><div data-chat-flow><div class="chat-node user" data-chat-node-key="user-1" data-chat-flow-kind="user" data-chat-turn="1"><div class="role">我</div><p>必须要抓住那灵光一现，抓住那想要记住的冲动。</p></div><div class="chat-node" data-chat-node-key="assistant-1" data-chat-flow-kind="assistant-step" data-chat-turn="1"><div class="role">AI</div><p>记录时的首要任务是<strong>保真</strong>，而不是组织。</p><p>当一个念头出现时，先把它留下。你不需要马上解释清楚，也不需要为它选一个分类。</p><p>保存一句话，只说明你想留住它，不代表你已经认同它。</p></div><div class="chat-node" data-chat-node-key="assistant-2" data-chat-flow-kind="assistant-step" data-chat-turn="2"><div class="role">AI</div><p>让过去的思考，在需要的时候重新参与现在。</p></div></div><div class="composer-mock"><textarea placeholder="继续对话…" aria-label="对话输入"></textarea></div>`}
const rows=()=>Object.fromEntries(['fixture-a','fixture-b'].map(id=>[id,{id,title:id==='fixture-a'?'乱记产品讨论':'另一段对话',retainedBy:{mainView:id===active?1:0}}]));
const ctx={effect(fn){const cleanup=fn();if(typeof cleanup==='function')cleanups.push(cleanup);return cleanup},slots:{inject(name,register){return register()},register(opts,Component){const map={'sidebar.panellist':'glyph','shell.overlay':'overlays',main:'management'};const target=map[opts.name];if(target)roots[target].render(h(Component,{size:16,active:false,wide:true}));return ()=>{}}},layout:{selectPanel(id){document.getElementById('conversation').hidden=!!id;document.getElementById('management').hidden=!id}},sessions:{list:{getSnapshot:()=>({byId:rows()}),subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)}},binding(id){return{sessionId:id,eventSource:{getSnapshot:()=>({entries:events})}}}},uiConversation:{binding(){return{target(){return{getSnapshot:()=>({nodes})}}}},interactions:{register(){return()=>{}}}},uiWorkspace:{openSession(id){active=id;renderConversation();listeners.forEach(fn=>fn())}}};
renderConversation();window.__luanjiDef.factory(name=>name==='react'?React:name==='react-dom'?ReactDOM:null).apply(ctx);
document.getElementById('session-a').onclick=()=>{ctx.uiWorkspace.openSession('fixture-a');ctx.layout.selectPanel(null)};document.getElementById('session-b').onclick=()=>{ctx.uiWorkspace.openSession('fixture-b');ctx.layout.selectPanel(null)};document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('light');
window.addEventListener('beforeunload',()=>cleanups.reverse().forEach(fn=>fn()));
</script></body></html>
